# CI 起步三样：build / test / Spotless（HANDOFF §8）。
# 测试自含（契约 fixture，无 Testcontainers）；backend job 另起 ParadeDB 服务容器（B158）：
# 灌基线（全新库守卫）+ 支撑两个连真 PG 的录测试。
# 2026-09-30 增：包结构守卫（环 / 分层棘轮，scripts/check-package-cycles.py）。
# 2026-10-02 增（B10）：架构规则随测试套件跑（boot/src/test/.../arch/ArchitectureRulesTest.java（B165 迁入）：
#   禁裸 getenv / 属性类必须被 @ConfigurationPropertiesScan 覆盖 / 配置类不得双装配 /
#   install* 只许装配层调用）——后端 job 的 `./gradlew build` 即闸门；包级规则仍归上面的 guards job。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: 包结构守卫（环 / 分层棘轮）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 八守卫跑**同一份** scripts/run-guards.sh（B168）：本地 `bash scripts/run-guards.sh` 即 CI 同口径。
      # 起因：本地手敲守卫时漏了 check-json-key-case 的 --strict（默认只报告、退出 0）⇒ 本地绿而 CI 红。
      - name: 八守卫（单一入口：包环 / Go 锚点 / 前端契约键 / 换锚 --strict / 事件面 / 大文件 / 目录卫生 / 死成员）
        run: bash scripts/run-guards.sh
  backend:
    name: 后端 build + test + spotless
    runs-on: ubuntu-latest
    services:
      # 与 docker-compose.yml 同镜像同口令（dev 1:1，B158）。CI 也起真库的两条理由：
      #   ① 灌库守卫：V1__baseline.sql 必须能灌进**全新** ParadeDB（B156 那类只有真库才暴露的缺陷）；
      #   ② 两个录测试（GrepChunksRecordingTest / DatabaseQueryRecordingTest）连真 PG 才跑 ——
      #      B157 曾因 CI 无库把它们按标签排除，现由本服务支撑、回归真跑（顺带成为 schema 冒烟）。
      postgres:
        image: paradedb/paradedb:v0.22.2-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123!@#
          POSTGRES_DB: WeKnora
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # spotless ratchetFrom('seed') 需要基线 tag 可达
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # 嵌入式 Redis 依赖 `redis-server` 在 PATH 上（common 的 EmbeddedRedis 夹具会自己起实例）。
      # ubuntu-latest 不带它 ⇒ 4 个 Redis 测试被 assumeTrue **静默跳过**（B170 实测：本地收窄 PATH
      # 复现出同样的 4 skipped，而 CI 只报 '4 skipped' 看不出丢了什么覆盖）。与 B158「CI 起真 PG」同一精神。
      - name: 装 redis-server（让 Redis 测试在 CI 真跑，不再静默跳过）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server
      - name: 灌基线（全新库守卫：V1__baseline.sql 必须能灌进空 ParadeDB）
        env:
          PGPASSWORD: 'postgres123!@#'
        run: >-
          psql -h localhost -p 15432 -U postgres -d WeKnora -v ON_ERROR_STOP=1 -q
          -f migrations/versioned/V1__baseline.sql
      - name: Spotless check（ratchet 自 seed，仅检查触碰过的文件）
        run: ./gradlew spotlessCheck
      - name: Build & test（PG 走默认 localhost:15432 + dev 同口令 ⇒ 两个录测试真跑）
        # `tee` 落盘 + pipefail 保退出码 ⇒ 失败时下面的注解步能把关键行变成注解（公开 API 可读 ✓）
        run: set -o pipefail; ./gradlew build 2>&1 | tee /tmp/build.log

      # B175：构建失败也自证 —— 日志要鉴权才看得到 ✗，这里把关键行（What went wrong / OOM / worker 崩 …）
      # 变成 ::error 注解 ⇒ job 页与公开 API 都能读 ✓。
      - name: 构建日志关键行（失败时把"为什么红"变成注解）
        if: failure()
        run: python3 scripts/ci-log-annotate.py /tmp/build.log

      # B171：失败/跳过都摆上台面 —— 失败用例名 + 首行消息、**跳过用例名 + 原因**（跳过 = 覆盖没跑）。
      # 在 Actions 里还会发 ::error/::notice 注解 ⇒ 可用公开 API 读（无需人肉捞日志）。
      - name: 测试汇总（失败与跳过清单；失败时也跑）
        if: always()
        run: python3 scripts/test-summary.py

  frontend:
    name: 前端 type-check + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build-only
