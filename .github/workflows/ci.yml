# CI 起步三样：build / test / Spotless（HANDOFF §8）。
# 测试自含（契约 fixture，无 Testcontainers）；backend job 另起 ParadeDB 服务容器（B158）：
# 灌基线（全新库守卫）+ 支撑两个连真 PG 的录测试。
# 2026-09-30 增：包结构守卫（环 / 分层棘轮，scripts/check-package-cycles.py）。
# 2026-10-02 增（B10）：架构规则随测试套件跑（boot/src/test/.../arch/ArchitectureRulesTest.java（B165 迁入）：
#   禁裸 getenv / 属性类必须被 @ConfigurationPropertiesScan 覆盖 / 配置类不得双装配 /
#   install* 只许装配层调用）——后端 job 的 `./gradlew build` 即闸门；包级规则仍归上面的 guards job。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: 包结构守卫（环 / 分层棘轮）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 八守卫跑**同一份** scripts/run-guards.sh（B168）：本地 `bash scripts/run-guards.sh` 即 CI 同口径。
      # 起因：本地手敲守卫时漏了 check-json-key-case 的 --strict（默认只报告、退出 0）⇒ 本地绿而 CI 红。
      - name: 八守卫（单一入口：包环 / Go 锚点 / 前端契约键 / 换锚 --strict / 事件面 / 大文件 / 目录卫生 / 死成员）
        run: bash scripts/run-guards.sh
  backend:
    name: 后端 build + test + spotless
    runs-on: ubuntu-latest
    services:
      # 与 docker-compose.yml 同镜像同口令（dev 1:1，B158）。CI 也起真库的两条理由：
      #   ① 灌库守卫：V1__baseline.sql 必须能灌进**全新** ParadeDB（B156 那类只有真库才暴露的缺陷）；
      #   ② 两个录测试（GrepChunksRecordingTest / DatabaseQueryRecordingTest）连真 PG 才跑 ——
      #      B157 曾因 CI 无库把它们按标签排除，现由本服务支撑、回归真跑（顺带成为 schema 冒烟）。
      postgres:
        image: paradedb/paradedb:v0.22.2-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123!@#
          POSTGRES_DB: WeKnora
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # spotless ratchetFrom('seed') 需要基线 tag 可达
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: 灌基线（全新库守卫：V1__baseline.sql 必须能灌进空 ParadeDB）
        env:
          PGPASSWORD: 'postgres123!@#'
        run: >-
          psql -h localhost -p 15432 -U postgres -d WeKnora -v ON_ERROR_STOP=1 -q
          -f migrations/versioned/V1__baseline.sql
      - name: Spotless check（ratchet 自 seed，仅检查触碰过的文件）
        run: ./gradlew spotlessCheck
      - name: Build & test（PG 走默认 localhost:15432 + dev 同口令 ⇒ 两个录测试真跑）
        run: ./gradlew build

  frontend:
    name: 前端 type-check + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build-only
