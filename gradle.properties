# 构建提速（B194，2026-10-10 实测本机 10 核 / 16GB）：
#   parallel       —— 四个模块（domains/engine/common/boot）可并行构建
#   caching        —— 任务输出进本地构建缓存，重复构建/切换分支时省掉重跑
#   jvmargs        —— 默认守护进程堆偏小，多模块并行时容易反复 GC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
