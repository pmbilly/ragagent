# ragagent 本地 dev 环境（基础设施：postgres / redis / docreader）

services:
  postgres:
    image: paradedb/paradedb:v0.22.2-pg17
    container_name: RagAgent-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123!@#
      POSTGRES_DB: WeKnora
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.0-alpine
    container_name: RagAgent-redis-dev
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  docreader:
    # 跟随上游 latest；固定版本参照：
    # wechatopenai/weknora-docreader@sha256:59e26f98f17c296c5f4bd216404558f51d31991b580cfef1d204903a01e4b46b
    image: wechatopenai/weknora-docreader:latest
    container_name: RagAgent-docreader-dev
    ports:
      - "50051:50051"
    restart: unless-stopped

volumes:
  postgres-data:
