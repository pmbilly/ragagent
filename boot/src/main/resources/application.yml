# RagAgent (Java) 服务端配置
# 键名沿用既有环境变量约定（DB_HOST 等），部署时用环境变量覆盖各默认值
server:
  port: ${SERVER_PORT:8080}
  # Spring Boot 的绑定地址属性是 server.address（server.host 是不存在的死键）
  address: ${SERVER_HOST:0.0.0.0}

spring:
  application:
    name: ragagent
  jackson:
    deserialization:
      # 未知属性不报错（与 JsonMappers.lenient() 同一策略：落库/外部 JSON 常带旧键）
      fail-on-unknown-properties: false
  servlet:
    multipart:
      # 上传限值 60MB：让 service 层的大小校验（50MB）先触发、给出业务化错误；
      # 超出 60MB 的请求由 TemporaryDocumentController 的
      # MaxUploadSizeExceededException 处理器转成 400 "request body too large"。
      max-file-size: 60MB
      max-request-size: 60MB
  threads:
    virtual:
      enabled: true          # JDK 21 虚拟线程（一请求一虚拟线程的执行模型）
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:WeKnora}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres123!@#}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      # dev Redis 开了 requirepass（.env 的 REDIS_PASSWORD）；未设时留空
      password: ${REDIS_PASSWORD:}
      # 可选的 Redis ACL 用户名与库号
      username: ${REDIS_USERNAME:}
      database: ${REDIS_DB:0}
      # REDIS_USE_TLS=true 才开 TLS（默认关）；暂不支持自定义 TLS 服务器名与
      # 跳过证书校验（有需求再接）。
      ssl:
        enabled: ${REDIS_USE_TLS:false}
  flyway:
    locations: classpath:db/migration,filesystem:./build/generated-migrations
    baseline-on-migrate: true   # 存量库自动 baseline，不重复执行历史迁移
    table: flyway_schema_history

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true   # 下划线列名 ↔ 驼峰属性自动映射
  global-config:
    banner: false

grpc:
  client:
    docreader:
      address: ${DOCREADER_ADDR:static://localhost:50051}
      negotiation-type: plaintext

# 流管理器：memory（单实例，进程内）| redis（跨实例共享，多实例部署时用）
weknora:
  persistence:
    tenant-filter-guard: ${WEKNORA_TENANT_FILTER_GUARD:enforce}   # off | alert | enforce：SELECT 缺失租户谓词探测（B71 定性后默认 enforce；降档排障用 alert/off）
  stream:
    type: ${STREAM_MANAGER_TYPE:memory}   # memory | redis（精确匹配，其余值一律按 memory）
    prefix: ${REDIS_PREFIX:}              # 原样拼接、不裁尾部冒号（"stream:" 会拼出双冒号；键名兼容性要求如此）
    ttl: 1h                               # 流数据 TTL（1 小时）

# wiki 域 Redis 面（多实例部署打开；缺省 false = 全部走进程内实现，单实例语义
# 与接线前完全一致）。打开 = slug 锁 / finalize 锁 / 身份认领 / 在途限流器 /
# 任务队列 / 删除墓碑 全部走 Redis；启动时 ping 一次，连不上则启动失败（不静默退化）。
wiki:
  redis-enabled: ${WIKI_REDIS_ENABLED:false}

# 后台模型并发闸门后端：缺省进程内信号量（单实例语义）；true = Redis 分布式
# 信号量（跨实例协调，ZSET 租约+心跳，启动时 ping 一次，连不上则启动失败）。
llm:
  limiter:
    redis-enabled: ${LLM_LIMITER_REDIS_ENABLED:false}

# embed 公开面限流：缺省进程内滑窗（单实例语义）；true = Redis 滑窗
# （跨实例共享预算，Redis 故障回落进程内滑窗，启动时 ping 一次）。
embed:
  redis-enabled: ${EMBED_REDIS_ENABLED:false}

# knowledge 任务队列（分块抽取/问题生成）：缺省进程内队列（单实例语义）；
# true = Redis 共享任务表（跨实例执行 + 崩溃回收重投，启动时 ping 一次）。
knowledge:
  redis-enabled: ${KNOWLEDGE_REDIS_ENABLED:false}

# memory 蒸馏队列：缺省进程内队列（单实例语义）；true = Redis 共享任务表
# （跨实例执行 + 崩溃回收重投；重复触发由租约保证不重复蒸馏，启动时 ping 一次）。
memory:
  redis-enabled: ${MEMORY_REDIS_ENABLED:false}

# datasource 同步队列：缺省进程内队列（多副本会各自触发一次同步）；true = Redis
# 共享任务表 + 全局 TaskID 去重（cron 同分钟一起触发时只有第一个赢，启动时 ping 一次）。
datasource:
  redis-enabled: ${DATASOURCE_REDIS_ENABLED:false}

# IM（企业微信/飞书等）Redis 面：缺省进程内（单实例语义）；true = 一次性打开
# 队列全局计数 / 消息去重 / 限流 / 跨实例 stop / 渠道配置广播 / WS 长连接选主
# 六个面（启动时 ping 一次，连不上则启动失败）。global-max-workers=跨实例并发上限，0=不限。
# （im.workers / im.max-queue / im.max-per-user / im.rate-limit-* 走代码缺省，见 ImService。）
im:
  redis-enabled: ${IM_REDIS_ENABLED:false}
  global-max-workers: ${IM_GLOBAL_MAX_WORKERS:0}

# ---- 业务配置（会话/检索等模块的默认值）----
conversation:
  max-rounds: 5
  keyword-threshold: 0.3
  embedding-top-k: 30
  vector-threshold: 0.2
  rerank-threshold: 0.3
  rerank-top-k: 30
  fallback-strategy: model
  enable-rewrite: true
  enable-query-expansion: true

logging:
  level:
    com.ragagent: ${LOG_LEVEL:INFO}
